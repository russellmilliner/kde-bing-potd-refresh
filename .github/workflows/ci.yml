name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build & test tools
        run: python -m pip install --upgrade pip "setuptools>=77" wheel build pytest
      - name: Run unit tests
        run: pytest -v
      - name: Build Python sdist and wheel
        run: python -m build
      - name: Verify wheel installation and CLI entrypoint
        run: |
          python -m pip install dist/*.whl
          kde-bing-potd-refresh --version
